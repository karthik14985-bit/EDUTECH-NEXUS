<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | EDUTECH NEXUS</title><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-enhancements.css"></head><body class="admin-login-page"><form id="admin-login-form" class="admin-login-card"><div class="eyebrow">EDUTECH NEXUS / SECURE ACCESS</div><h1>Admin Control Center</h1><p>Sign in to manage students, learning content, events, games, clubs, and platform activity.</p><label for="admin-email">Administrator email or username<input id="admin-email" type="text" placeholder="admin email or username" autocomplete="username" required></label><label for="admin-password">Password<input id="admin-password" type="password" placeholder="Enter password" autocomplete="current-password" required></label><button id="admin-submit" type="submit">Open admin dashboard</button><p class="admin-error" id="admin-error" role="alert"></p></form><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.getElementById('admin-login-form').addEventListener('submit',async event=>{event.preventDefault();const error=document.getElementById('admin-error');const button=document.getElementById('admin-submit');button.disabled=true;error.textContent='';try{const result=await api.post('/auth/login',{emailOrUsername:document.getElementById('admin-email').value.trim(),password:document.getElementById('admin-password').value});if(!result.success||!result.user||result.user.role!=='admin')throw new Error('Administrator access required');auth.saveSession(result,true);window.location.replace('admin-dashboard.html');}catch(exception){error.textContent=exception.message||'Unable to sign in. Please check your credentials.';button.disabled=false;}});</script></body></html>
