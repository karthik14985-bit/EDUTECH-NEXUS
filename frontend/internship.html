<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Directory | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .companies-directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 26px;
      margin-bottom: 36px;
    }
    .company-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      transition: var(--transition-normal);
      position: relative;
    }
    .company-card-item:hover {
      transform: translateY(-5px);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
    }
    .company-card-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }
    .company-avatar {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid var(--border-medium);
      flex-shrink: 0;
    }
    .company-badge-box {
      font-size: 11px;
      font-weight: 700;
      color: #10b981;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .domains-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 16px;
    }
    .domain-tag {
      font-size: 11.5px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      color: #c7d2fe;
    }
    .company-stats-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .company-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = await renderStudentLayout('internship.html', 'Industry Internship Directory', 'Review vetted enterprise partners, available technical domains, and submit official applications.');
      if (!layout) return;

      const { pageContent, headerActions } = layout;

      headerActions.innerHTML = `
        <span class="nexus-badge badge-blue"><i class="fa-solid fa-building"></i> Maximum 5 Enterprises</span>
      `;

      pageContent.innerHTML = `
        <div class="toolbar-section">
          <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="company-search" class="nexus-input" placeholder="Search enterprise by name, domain, or skills...">
          </div>
        </div>

        <div class="companies-directory-grid" id="companies-grid">
          <div class="state-container" style="grid-column:1/-1;">
            <div class="state-spinner"></div>
            <div class="state-title">Loading Featured Enterprises from Database...</div>
          </div>
        </div>
      `;

      let companies = [];

      async function fetchCompanies() {
        try {
          const res = await api.get('/companies');
          companies = (res.companies || []).slice(0, 5); // Enforce maximum 5 companies
          renderCompanies(companies);
        } catch (err) {
          document.getElementById('companies-grid').innerHTML = `
            <div class="state-container" style="grid-column:1/-1;">
              <div class="state-icon" style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i></div>
              <div class="state-title">Unable to Load Enterprises</div>
              <p class="state-desc">${err.message}</p>
            </div>
          `;
        }
      }

      function renderCompanies(list) {
        const grid = document.getElementById('companies-grid');
        if (!grid) return;

        const query = (document.getElementById('company-search')?.value || '').toLowerCase().trim();
        const filtered = list.filter(c => {
          const text = `${c.name} ${c.industry || ''} ${c.description || ''} ${c.availableDomains || ''}`.toLowerCase();
          return !query || text.includes(query);
        });

        if (!filtered.length) {
          grid.innerHTML = `
            <div class="state-container" style="grid-column:1/-1;">
              <div class="state-icon"><i class="fa-solid fa-building"></i></div>
              <div class="state-title">No Enterprises Found</div>
              <p class="state-desc">Try clearing your search query.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = filtered.map(c => {
          const logo = c.logo || 'https://images.unsplash.com/photo-1549923746-c502d488b3ea?auto=format&fit=crop&w=200&q=80';
          const domains = Array.isArray(c.availableDomains) ? c.availableDomains : (c.availableDomains || 'Software Engineering, Web Development').split(',').map(s => s.trim());
          const duration = c.internshipDuration || '8 to 12 Weeks';

          return `
            <div class="company-card-item">
              <div>
                <div class="company-card-header">
                  <img src="${logo}" alt="${c.name}" class="company-avatar" onerror="this.src='https://images.unsplash.com/photo-1549923746-c502d488b3ea?auto=format&fit=crop&w=200&q=80'">
                  <div>
                    <span class="company-badge-box"><i class="fa-solid fa-circle-check"></i> Featured Partner</span>
                    <h3 style="font-size:20px;color:#fff;margin:2px 0 4px;">${c.name}</h3>
                    <div style="font-size:12px;color:var(--text-secondary);">${c.location || 'India & Global'}</div>
                  </div>
                </div>

                <p style="color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">
                  ${c.description || c.about || 'Leading enterprise offering high-impact internship tracks for engineering scholars.'}
                </p>

                <!-- Available Domains -->
                <div style="font-size:11px;font-weight:700;color:var(--cyan-accent);text-transform:uppercase;letter-spacing:0.5px;">
                  AVAILABLE DOMAINS:
                </div>
                <div class="domains-pill-row">
                  ${domains.slice(0, 3).map(d => `<span class="domain-tag">${d}</span>`).join('')}
                  ${domains.length > 3 ? `<span class="domain-tag">+${domains.length - 3} more</span>` : ''}
                </div>

                <div class="company-stats-box">
                  <div style="display:flex;justify-content:space-between;">
                    <span><i class="fa-regular fa-clock" style="color:#fbbf24;"></i> Duration:</span>
                    <strong style="color:#fff;">${duration}</strong>
                  </div>
                  <div style="display:flex;justify-content:space-between;">
                    <span><i class="fa-solid fa-graduation-cap" style="color:var(--cyan-accent);"></i> Eligibility:</span>
                    <strong style="color:#cbd5e1;text-align:right;">Students & Graduates</strong>
                  </div>
                </div>
              </div>

              <div class="company-actions-grid">
                <a href="company-profile.html?id=${c._id}" class="btn-nexus btn-nexus-primary" style="padding:10px;font-size:13px;text-align:center;">
                  View Profile
                </a>
                <a href="company-profile.html?id=${c._id}" class="btn-nexus btn-nexus-glow" style="padding:10px;font-size:13px;text-align:center;">
                  <i class="fa-solid fa-paper-plane"></i> Apply Now
                </a>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('company-search')?.addEventListener('input', () => renderCompanies(companies));

      await fetchCompanies();
    });
  </script>
</body>
</html>
