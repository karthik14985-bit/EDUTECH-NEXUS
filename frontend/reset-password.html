<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 460px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-card);
      position: relative;
      z-index: 10;
    }
    .brand-center {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple-primary), var(--blue-electric));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="brand-center">
        <a href="home.html" style="text-decoration:none;">
          <div class="brand-logo-icon">EN</div>
          <h2 style="font-size:22px;color:#fff;">EDUTECH NEXUS</h2>
          <span style="font-size:12px;color:var(--cyan-accent);text-transform:uppercase;letter-spacing:1px;font-weight:600;">Secure Reset</span>
        </a>
      </div>

      <p style="color:var(--text-secondary);font-size:14px;margin-bottom:24px;text-align:center;">
        Create your new secure password (at least 8 characters).
      </p>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="password" class="nexus-input" minlength="8" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="confirm" class="nexus-input" minlength="8" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-nexus btn-nexus-primary" id="submit-btn" style="width:100%;padding:12px;margin-top:6px;">
          Reset & Save Password
        </button>

        <div id="status-box" style="display:none;margin-top:20px;padding:14px;border-radius:var(--radius-sm);font-size:13px;"></div>

        <div style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-secondary);">
          <a href="login.html" style="color:var(--cyan-accent);font-weight:600;text-decoration:none;">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const box = document.getElementById('status-box');

      if (!token) {
        box.style.display = 'block';
        box.style.background = 'rgba(239, 68, 68, 0.15)';
        box.style.border = '1px solid rgba(239, 68, 68, 0.35)';
        box.style.color = '#fca5a5';
        box.innerHTML = '<strong><i class="fa-solid fa-triangle-exclamation"></i> Missing or invalid reset token. Please request a new link from the forgot password page.</strong>';
        document.getElementById('submit-btn').disabled = true;
      }

      document.getElementById('reset-form').onsubmit = async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('confirm').value;

        if (p1 !== p2) {
          box.style.display = 'block';
          box.style.background = 'rgba(239, 68, 68, 0.15)';
          box.style.border = '1px solid rgba(239, 68, 68, 0.35)';
          box.style.color = '#fca5a5';
          box.innerHTML = '<strong>Passwords do not match</strong>';
          return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating Password...';

        try {
          const res = await api.post('/auth/reset-password', { token, password: p1 });
          btn.innerHTML = 'Password Reset!';
          box.style.display = 'block';
          box.style.background = 'rgba(16, 185, 129, 0.15)';
          box.style.border = '1px solid rgba(16, 185, 129, 0.35)';
          box.style.color = '#a7f3d0';
          box.innerHTML = `<strong><i class="fa-solid fa-circle-check"></i> ${res.message} Redirecting to login...</strong>`;

          setTimeout(() => {
            location.href = 'login.html';
          }, 1200);
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = 'Reset & Save Password';
          box.style.display = 'block';
          box.style.background = 'rgba(239, 68, 68, 0.15)';
          box.style.border = '1px solid rgba(239, 68, 68, 0.35)';
          box.style.color = '#fca5a5';
          box.innerHTML = `<strong><i class="fa-solid fa-triangle-exclamation"></i> ${err.message}</strong>`;
        }
      };
    });
  </script>
</body>
</html>
