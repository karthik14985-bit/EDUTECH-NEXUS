<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Common Technical Games Leaderboard | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .leaderboard-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 30px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .leaderboard-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .view-toggle-btns {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px;
    }
    .toggle-tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .toggle-tab-btn.active {
      background: #6366f1;
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }
    .student-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .student-avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #0f172a;
      border: 2px solid var(--border-medium);
      flex-shrink: 0;
    }
    .rank-number-box {
      font-weight: 800;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .rank-1 { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.4); }
    .rank-2 { background: rgba(148, 163, 184, 0.2); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.4); }
    .rank-3 { background: rgba(217, 119, 6, 0.2); color: #f59e0b; border: 1px solid rgba(217, 119, 6, 0.4); }
    .rank-other { color: var(--text-secondary); }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = await renderStudentLayout('leaderboard.html', 'Common Technical Games Leaderboard', 'Real-time ranking of students across all three technical games. Automatically updated upon game completion.');
      if (!layout) return;

      const { pageContent, headerActions } = layout;

      headerActions.innerHTML = `
        <span class="live-indicator"><span class="live-dot"></span> Live Sync</span>
        <a href="games.html" class="btn-nexus btn-nexus-primary">
          <i class="fa-solid fa-gamepad"></i> Play Technical Games
        </a>
      `;

      pageContent.innerHTML = `
        <div class="leaderboard-container">
          <div class="leaderboard-controls-row">
            <!-- Left: View Toggle (Top 10 vs View All) -->
            <div class="view-toggle-btns">
              <button type="button" class="toggle-tab-btn active" id="tab-top10">
                <i class="fa-solid fa-ranking-star"></i> Top 10 Performers
              </button>
              <button type="button" class="toggle-tab-btn" id="tab-all">
                <i class="fa-solid fa-users"></i> View All Participants
              </button>
            </div>

            <!-- Right: Filter by Game -->
            <div style="display:flex;gap:10px;align-items:center;">
              <select id="game-filter-select" class="nexus-select" style="min-width:200px;">
                <option value="all">All Technical Games</option>
                <option value="Debugging Challenge">Debugging Challenge</option>
                <option value="Technical Quiz">Technical Quiz</option>
                <option value="Logic & Coding Challenge">Logic & Coding Challenge</option>
              </select>
            </div>
          </div>

          <!-- Table of Rankings -->
          <div class="table-responsive">
            <table class="nexus-table">
              <thead>
                <tr>
                  <th style="width:70px;">Rank</th>
                  <th>Student Name</th>
                  <th>Department</th>
                  <th>Game Name</th>
                  <th>Total Score</th>
                  <th>Correct Answers</th>
                  <th>Completion Date</th>
                </tr>
              </thead>
              <tbody id="leaderboard-tbody">
                <tr>
                  <td colspan="7" style="text-align:center;padding:40px;">
                    <div class="state-spinner" style="margin:0 auto 12px;"></div>
                    Loading Leaderboard Rankings from Database...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      let currentView = 'top10'; // 'top10' or 'all'
      let currentGameFilter = 'all';

      async function fetchGameLeaderboard() {
        const tbody = document.getElementById('leaderboard-tbody');
        try {
          const isAll = currentView === 'all';
          const queryParams = new URLSearchParams({
            all: isAll ? 'true' : 'false',
            limit: isAll ? '100' : '10',
            game: currentGameFilter
          });

          const res = await api.get(`/games/leaderboard?${queryParams.toString()}`);
          if (!res.success || !Array.isArray(res.leaderboard)) {
            throw new Error(res.message || 'Unable to load leaderboard data.');
          }

          const list = res.leaderboard;

          if (!list.length) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">
                  <i class="fa-solid fa-trophy" style="font-size:32px;margin-bottom:10px;display:block;opacity:0.4;"></i>
                  No verified game scores recorded yet for this selection. Play a game to claim Rank 1!
                </td>
              </tr>
            `;
            return;
          }

          tbody.innerHTML = list.map((item, index) => {
            const rank = item.rank || (index + 1);
            let rankClass = 'rank-other';
            let rankBadge = `#${rank}`;

            if (rank === 1) { rankClass = 'rank-1'; rankBadge = '🥇 1'; }
            else if (rank === 2) { rankClass = 'rank-2'; rankBadge = '🥈 2'; }
            else if (rank === 3) { rankClass = 'rank-3'; rankBadge = '🥉 3'; }

            const avatar = item.profileImage || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(item.studentName)}`;
            const dateStr = item.completionDate 
              ? new Date(item.completionDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
              : 'Recent';

            const isCurrentStudent = item.studentName === layout.currentUser?.fullName;

            return `
              <tr style="${isCurrentStudent ? 'background:rgba(99,102,241,0.12);' : ''}">
                <td>
                  <span class="rank-number-box ${rankClass}">${rankBadge}</span>
                </td>
                <td>
                  <div class="student-cell">
                    <img src="${avatar}" alt="${item.studentName}" class="student-avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=ET'">
                    <div>
                      <strong style="color:#fff;display:block;">${item.studentName}</strong>
                      ${isCurrentStudent ? '<span class="nexus-badge badge-purple" style="font-size:10px;padding:1px 6px;">You</span>' : ''}
                    </div>
                  </div>
                </td>
                <td>
                  <span style="color:#cbd5e1;">${item.department || 'Computer Science'}</span>
                </td>
                <td>
                  <span class="nexus-badge badge-blue">${item.gameName}</span>
                </td>
                <td>
                  <strong style="color:#fbbf24;font-size:16px;">${item.totalScore} Pts</strong>
                </td>
                <td>
                  <span style="color:#10b981;font-weight:700;"><i class="fa-solid fa-circle-check"></i> ${item.correctAnswers || 0}</span>
                </td>
                <td style="color:var(--text-secondary);font-size:13px;">
                  ${dateStr}
                </td>
              </tr>
            `;
          }).join('');

        } catch (err) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align:center;color:#ef4444;padding:30px;">
                <i class="fa-solid fa-triangle-exclamation"></i> Error loading leaderboard: ${err.message}
              </td>
            </tr>
          `;
        }
      }

      // View toggle event listeners
      const top10Btn = document.getElementById('tab-top10');
      const allBtn = document.getElementById('tab-all');
      const gameFilter = document.getElementById('game-filter-select');

      top10Btn.onclick = () => {
        currentView = 'top10';
        top10Btn.classList.add('active');
        allBtn.classList.remove('active');
        fetchGameLeaderboard();
      };

      allBtn.onclick = () => {
        currentView = 'all';
        allBtn.classList.add('active');
        top10Btn.classList.remove('active');
        fetchGameLeaderboard();
      };

      gameFilter.onchange = () => {
        currentGameFilter = gameFilter.value;
        fetchGameLeaderboard();
      };

      await fetchGameLeaderboard();
      // Auto refresh every 15s
      setInterval(fetchGameLeaderboard, 15000);
    });
  </script>
</body>
</html>
