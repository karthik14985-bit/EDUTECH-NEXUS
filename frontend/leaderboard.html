<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Leaderboard | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .podium-section {
      margin-bottom: 36px;
    }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = await renderStudentLayout('leaderboard.html', 'Statewide Student Leaderboard', 'Real-time ranking of technology scholars based on cumulative experience points (XP).');
      if (!layout) return;

      const { pageContent, headerActions } = layout;

      headerActions.innerHTML = `
        <span class="live-indicator"><span class="live-dot"></span> Live Sync</span>
      `;

      pageContent.innerHTML = `
        <!-- Top 3 Podium -->
        <div class="podium-section">
          <div class="podium-container" id="top3-podium">
            <div class="state-container" style="grid-column:1/-1;">
              <div class="state-spinner"></div>
              <div class="state-title">Loading Top 3 Champions...</div>
            </div>
          </div>
        </div>

        <!-- Full Table Section -->
        <div class="glass-panel" style="padding:26px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
            <h3 style="font-size:19px;"><i class="fa-solid fa-list-ol" style="color:var(--cyan-accent);"></i> Complete Student Rankings</h3>
            <div class="search-input-wrapper" style="max-width:300px;">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="leaderboard-search" class="nexus-input" placeholder="Search by name or college...">
            </div>
          </div>

          <div class="table-responsive">
            <table class="nexus-table">
              <thead>
                <tr>
                  <th style="width:80px;">Rank</th>
                  <th>Student Name</th>
                  <th>Department</th>
                  <th>Institution / College</th>
                  <th>Level</th>
                  <th>XP Points</th>
                  <th>Badge</th>
                </tr>
              </thead>
              <tbody id="leaderboard-tbody">
                <tr>
                  <td colspan="7" style="text-align:center;padding:40px;">
                    <div class="state-spinner" style="margin:0 auto 10px;"></div>
                    Loading Leaderboard Rankings...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      let allRanks = [];

      async function fetchLeaderboard() {
        try {
          const res = await api.get('/leaderboard');
          allRanks = res.leaderboard || [];

          // Render Podium (Top 3)
          const podium = document.getElementById('top3-podium');
          if (allRanks.length >= 1) {
            const r1 = allRanks[0];
            const r2 = allRanks[1];
            const r3 = allRanks[2];

            let podHtml = '';
            if (r2) {
              podHtml += `
                <div class="podium-card rank-2">
                  <span class="podium-badge">🥈</span>
                  <span class="nexus-badge badge-blue" style="margin-bottom:8px;">Rank 2</span>
                  <div class="podium-name">${r2.name}</div>
                  <div class="podium-dept">${r2.department}</div>
                  <div class="podium-xp">${r2.xp} XP</div>
                </div>
              `;
            }
            if (r1) {
              podHtml += `
                <div class="podium-card rank-1">
                  <span class="podium-badge">🥇</span>
                  <span class="nexus-badge badge-amber" style="margin-bottom:8px;">Champion · Rank 1</span>
                  <div class="podium-name" style="font-size:22px;">${r1.name}</div>
                  <div class="podium-dept">${r1.department}</div>
                  <div class="podium-xp" style="font-size:26px;color:#fbbf24;">${r1.xp} XP</div>
                </div>
              `;
            }
            if (r3) {
              podHtml += `
                <div class="podium-card rank-3">
                  <span class="podium-badge">🥉</span>
                  <span class="nexus-badge badge-purple" style="margin-bottom:8px;">Rank 3</span>
                  <div class="podium-name">${r3.name}</div>
                  <div class="podium-dept">${r3.department}</div>
                  <div class="podium-xp">${r3.xp} XP</div>
                </div>
              `;
            }
            podium.innerHTML = podHtml;
          }

          renderTable(allRanks);
        } catch (err) {
          document.getElementById('leaderboard-tbody').innerHTML = `
            <tr><td colspan="7" style="text-align:center;color:#ef4444;padding:30px;">Failed to load leaderboard: ${err.message}</td></tr>
          `;
        }
      }

      function renderTable(list) {
        const tbody = document.getElementById('leaderboard-tbody');
        const query = (document.getElementById('leaderboard-search')?.value || '').toLowerCase().trim();

        const filtered = list.filter(u => {
          return !query || u.name.toLowerCase().includes(query) || (u.department || '').toLowerCase().includes(query) || (u.college || '').toLowerCase().includes(query);
        });

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">No student matches this filter.</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map(u => {
          const rankDisplay = u.rank === 1 ? '🥇 1' : u.rank === 2 ? '🥈 2' : u.rank === 3 ? '🥉 3' : `#${u.rank}`;
          const isMe = u.name === layout.currentUser.fullName;

          return `
            <tr style="${isMe ? 'background:rgba(108,76,255,0.1);' : ''}">
              <td style="font-weight:700;font-size:15px;color:${u.rank <= 3 ? '#fbbf24' : 'var(--text-secondary)'};">${rankDisplay}</td>
              <td>
                <strong style="color:#fff;">${u.name}</strong> ${isMe ? '<span class="nexus-badge badge-purple" style="font-size:10px;padding:1px 6px;">You</span>' : ''}
              </td>
              <td>${u.department || '-'}</td>
              <td style="color:var(--text-secondary);">${u.college || '-'}</td>
              <td><span class="nexus-badge badge-blue">Level ${u.level || 1}</span></td>
              <td><strong style="color:var(--cyan-accent);">${u.xp || 0} XP</strong></td>
              <td><span class="nexus-badge ${u.badge === 'Master' ? 'badge-amber' : u.badge === 'Expert' ? 'badge-purple' : u.badge === 'Achiever' ? 'badge-green' : 'badge-blue'}">${u.badge || 'Starter'}</span></td>
            </tr>
          `;
        }).join('');
      }

      document.getElementById('leaderboard-search')?.addEventListener('input', () => renderTable(allRanks));

      await fetchLeaderboard();
      // Auto-refresh leaderboard every 20 seconds
      setInterval(fetchLeaderboard, 20000);
    });
  </script>
</body>
</html>
