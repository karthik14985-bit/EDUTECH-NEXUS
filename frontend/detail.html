<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Details | EDUTECH NEXUS</title><link rel="stylesheet" href="css/student-modules.css"></head><body><script src="js/api.js"></script><script src="js/auth.js"></script><script>const typeMap={courses:'/courses',internships:'/internships',events:'/events',games:'/games',clubs:'/clubs'};const labelMap={courses:'Course',internships:'Internship',events:'Event',games:'Game',clubs:'Club'};const id=new URLSearchParams(location.search).get('id'),type=new URLSearchParams(location.search).get('type');const byId=id=>document.getElementById(id);function escapeText(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}async function init(){const user=await auth.requireLogin();if(!user)return;if(!id||!type||!typeMap[type])return;const result=await api.get(`${typeMap[type]}/${id}`);const item=result[type.slice(0,-1)]||result[type];document.body.innerHTML=`<main class="student-main" style="margin-left:0;width:100%;max-width:900px;margin-right:auto"><header class="student-top"><div><div class="eyebrow">EDUTECH NEXUS / ${labelMap[type]}</div><h1>${escapeText(item.title||item.name)}</h1><p class="muted">${escapeText(item.description)}</p></div><div class="identity">${escapeText(user.fullName)}<br><small>${escapeText(user.email)}</small></div></header><section class="card" id="detail-card"><div class="meta">Category: ${escapeText(item.category||'-')}</div><div class="meta">Company/Organizer: ${escapeText(item.company||item.organizer||item.leader?.fullName||'-')}</div><div class="meta">Date/Duration: ${escapeText(item.date?new Date(item.date).toLocaleDateString():item.duration||'-')}</div><div class="meta">Location: ${escapeText(item.location||item.venue||'-')}</div><p>${escapeText(item.description||'')}</p><button class="btn" id="primary">${type==='games'?'Start game':type==='clubs'?'Join club':type==='courses'?'Register course':type==='internships'?'Register internship':'Register event'}</button><a class="btn secondary" href="${type==='courses'?'courses.html':type==='internships'?'internship.html':type==='events'?'events.html':type==='games'?'games.html':'clubs.html'}">Back</a></section></main>`;byId('primary').onclick=async()=>{try{if(type==='games'){const game=await api.get(`/games/${id}`);const answers=game.game.questions.map(question=>Number(prompt(`${question.question}\n${question.options.map((option,index)=>`${index}: ${option}`).join('\n')}`)));const score=await api.post(`/games/${id}/submit`,{answers});alert(`Score: ${score.score}/${score.totalQuestions}. XP earned: ${score.xpEarned}`)}else{await api.post(`${typeMap[type]}/${id}/register`,{});alert('Registration successful');byId('primary').disabled=true;byId('primary').textContent='Registered'}}catch(error){alert(error.message)}}}init().catch(error=>{document.body.innerHTML=`<main class="student-main" style="margin-left:0"><div class="empty">${escapeText(error.message)}</div></main>`});</script></body></html>
