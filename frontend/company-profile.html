<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .company-header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 26px;
      backdrop-filter: blur(16px);
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    .company-profile-logo {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      object-fit: cover;
      background: #0f172a;
      border: 2px solid var(--border-medium);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .company-title-area {
      flex: 1;
      min-width: 260px;
    }
    .company-title-area h2 {
      font-size: 26px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .company-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .info-card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      backdrop-filter: blur(14px);
    }
    .info-card-box .label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-card-box .val {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      word-break: break-word;
    }
    .info-card-box .val a {
      color: var(--cyan-accent);
      text-decoration: none;
    }
    .info-card-box .val a:hover {
      text-decoration: underline;
    }
    .disclaimer-card {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 28px;
      color: #fde68a;
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .opportunities-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px;
      backdrop-filter: blur(14px);
    }
    .opportunities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .opp-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition-normal);
    }
    .opp-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = await renderStudentLayout('internship.html', 'Company Profile', 'Corporate background, recruitment policies, and listed internship opportunities.');
      if (!layout) return;

      const { pageContent, headerActions } = layout;

      const urlParams = new URLSearchParams(window.location.search);
      const companyId = urlParams.get('id');

      headerActions.innerHTML = `
        <a href="internship.html" class="btn-nexus btn-nexus-secondary">
          <i class="fa-solid fa-arrow-left"></i> All Internships
        </a>
      `;

      if (!companyId) {
        pageContent.innerHTML = `
          <div class="state-container">
            <div class="state-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
            <div class="state-title">No Company Selected</div>
            <p class="state-desc">Please choose a company from an internship card.</p>
            <a href="internship.html" class="btn-nexus btn-nexus-primary" style="margin-top:16px;">Browse Internships</a>
          </div>
        `;
        return;
      }

      pageContent.innerHTML = `
        <div class="state-container" id="profile-loader">
          <div class="state-spinner"></div>
          <div class="state-title">Loading Company Details...</div>
        </div>
        <div id="company-content" style="display:none;"></div>
      `;

      try {
        const res = await api.get(`/companies/${companyId}`);
        if (!res.success || !res.company) throw new Error(res.message || 'Company not found');

        const company = res.company;
        const internships = res.internships || [];
        const documents = res.documents || [];
        const profilePdf = company.profilePdfUrl || documents.find(d => d.documentType?.includes('Profile') || d.mimeType === 'application/pdf')?.fileUrl;
        const isVerified = company.verificationStatus === 'Verified';

        document.getElementById('profile-loader').style.display = 'none';
        const content = document.getElementById('company-content');
        content.style.display = 'block';

        const logo = company.logo || 'https://images.unsplash.com/photo-1549923746-c502d488b3ea?auto=format&fit=crop&w=200&q=80';

        content.innerHTML = `
          <!-- Header Card -->
          <div class="company-header-card">
            <img src="${logo}" alt="${company.name}" class="company-profile-logo" onerror="this.src='https://images.unsplash.com/photo-1549923746-c502d488b3ea?auto=format&fit=crop&w=200&q=80'">
            <div class="company-title-area">
              <h2>
                ${company.name}
                <span class="nexus-badge ${isVerified ? 'badge-green' : 'badge-amber'}">
                  ${isVerified ? '<i class="fa-solid fa-circle-check"></i> Verified Organization' : '<i class="fa-solid fa-info-circle"></i> Example Company Record'}
                </span>
              </h2>
              <p style="color:var(--text-secondary);font-size:14px;margin-top:6px;">
                ${company.about || company.industry || 'Technology & Innovation'}
              </p>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
              ${profilePdf ? `
                <a href="${profilePdf}" target="_blank" rel="noopener noreferrer" class="btn-nexus btn-nexus-secondary" style="padding:10px 18px;display:inline-flex;align-items:center;gap:8px;">
                  <i class="fa-solid fa-file-pdf" style="color:#ef4444;font-size:16px;"></i> VIEW COMPANY PROFILE PDF
                </a>
              ` : ''}
              ${company.website ? `
                <a href="${company.website}" target="_blank" rel="noopener noreferrer" class="btn-nexus btn-nexus-primary" style="padding:10px 18px;display:inline-flex;align-items:center;gap:8px;">
                  <i class="fa-solid fa-globe"></i> Visit Official Website <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;"></i>
                </a>
              ` : ''}
            </div>
          </div>

          <!-- Real Company Disclaimer / Verification Notice -->
          <div class="disclaimer-card">
            <i class="fa-solid fa-shield-halved" style="font-size:18px;margin-top:2px;"></i>
            <div>
              <strong>Record Authenticity & Verification Notice</strong>
              <p style="margin-top:3px;">
                ${isVerified 
                  ? 'This corporate profile has been reviewed and verified by the EDUTECH NEXUS administration team.' 
                  : 'This profile is an illustrative example record for educational workflow demonstrations. EDUTECH NEXUS does not claim an official partnership. Please verify recruitment and application details on the official company website.'}
              </p>
            </div>
          </div>

          <!-- Company Meta Details Grid -->
          <div class="company-info-grid">
            <div class="info-card-box">
              <div class="label"><i class="fa-solid fa-industry"></i> Industry</div>
              <div class="val">${company.industry || 'Information Technology & Services'}</div>
            </div>
            <div class="info-card-box">
              <div class="label"><i class="fa-solid fa-users"></i> Company Size</div>
              <div class="val">${company.companySize || company.size || '10,000+ Employees'}</div>
            </div>
            <div class="info-card-box">
              <div class="label"><i class="fa-solid fa-location-dot"></i> Location</div>
              <div class="val">${company.location || 'Pan India & Global'}</div>
            </div>
            <div class="info-card-box">
              <div class="label"><i class="fa-solid fa-envelope"></i> Contact / Inquiries</div>
              <div class="val">
                ${company.email ? `<a href="mailto:${company.email}">${company.email}</a>` : '<span style="color:var(--text-muted);">See official careers portal</span>'}
              </div>
            </div>
            <div class="info-card-box">
              <div class="label"><i class="fa-solid fa-phone"></i> Telephone</div>
              <div class="val">${company.phone || company.contact || '<span style="color:var(--text-muted);">Not publicly listed</span>'}</div>
            </div>
            <div class="info-card-box">
              <div class="label"><i class="fa-solid fa-link"></i> Careers Link</div>
              <div class="val">
                ${company.website ? `<a href="${company.website}" target="_blank" rel="noopener noreferrer">${company.website.replace(/^https?:\/\//, '')}</a>` : 'N/A'}
              </div>
            </div>
          </div>

          <!-- Detailed Description Section -->
          <div class="opportunities-section" style="margin-bottom:28px;">
            <h3 style="font-size:19px;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
              <i class="fa-solid fa-building-columns" style="color:var(--cyan-accent);"></i> About ${company.name}
            </h3>
            <p style="color:var(--text-secondary);font-size:15px;line-height:1.8;">
              ${company.description || company.about || 'Company description is not available.'}
            </p>
          </div>

          <!-- Listed Internship Opportunities -->
          <div class="opportunities-section">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
              <h3 style="font-size:19px;color:#fff;display:flex;align-items:center;gap:8px;">
                <i class="fa-solid fa-briefcase" style="color:var(--neon-purple);"></i> Active Internship Opportunities (${internships.length})
              </h3>
            </div>

            ${internships.length === 0 ? `
              <div class="state-container" style="padding:30px;">
                <div class="state-icon"><i class="fa-solid fa-folder-open"></i></div>
                <div class="state-title">No Active Internships Posted</div>
                <p class="state-desc">There are currently no open internship postings for this company. Check back soon.</p>
              </div>
            ` : `
              <div class="opportunities-grid">
                ${internships.map(opp => `
                  <div class="opp-card">
                    <div>
                      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                        <span class="nexus-badge ${(opp.fee && opp.fee > 0) ? 'badge-amber' : 'badge-green'}">${(opp.fee && opp.fee > 0) ? 'Paid Track' : 'Free Application'}</span>
                        <span class="nexus-badge badge-blue">${opp.workMode || 'Hybrid'}</span>
                        <span class="nexus-badge badge-purple">${opp.duration || '3 Months'}</span>
                      </div>
                      <h4 style="font-size:17px;color:#fff;margin-bottom:6px;">${opp.title}</h4>
                      <p style="color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                        ${opp.description}
                      </p>
                      <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">
                        Stipend: <strong style="color:#6ee7b7;">${opp.stipend || 'Competitive'}</strong>
                      </div>
                      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">
                        Eligibility: <strong style="color:#cbd5e1;">${opp.eligibility || 'Not specified'}</strong>
                      </div>
                      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">
                        Required skills: <strong style="color:#cbd5e1;">${opp.skills?.length ? opp.skills.join(', ') : 'Not specified'}</strong>
                      </div>
                      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">
                        Application information: <strong style="color:#cbd5e1;">${opp.applicationMethod || 'Not specified'}</strong>
                        ${opp.applicationLink ? `<a href="${opp.applicationLink}" target="_blank" rel="noopener noreferrer" style="color:var(--cyan-accent);margin-left:6px;">Open application</a>` : ''}
                      </div>
                    </div>

                    <a href="internship-details.html?id=${opp._id}" class="btn-nexus btn-nexus-primary" style="width:100%;font-size:13px;text-align:center;">
                      VIEW INTERNSHIP <i class="fa-solid fa-arrow-right"></i>
                    </a>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      } catch (err) {
        document.getElementById('profile-loader').innerHTML = `
          <div class="state-icon" style="color:#ef4444;"><i class="fa-solid fa-circle-exclamation"></i></div>
          <div class="state-title">Error Loading Company</div>
          <p class="state-desc">${err.message}</p>
          <a href="internship.html" class="btn-nexus btn-nexus-primary" style="margin-top:16px;">Back to Internships</a>
        `;
      }
    });
  </script>
</body>
</html>
