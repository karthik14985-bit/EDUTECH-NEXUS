<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technical Quiz Arena | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      max-width: 860px;
      margin: 0 auto;
    }

    /* Setup Screen */
    .languages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      margin: 18px 0 26px;
    }
    .lang-card-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #fff;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .lang-card-btn:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-3px);
    }
    .lang-card-btn.selected {
      background: rgba(99, 102, 241, 0.25);
      border-color: #6366f1;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }
    .lang-icon {
      font-size: 26px;
    }

    /* Active Quiz Screen */
    .quiz-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .timer-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
    }
    .progress-track-quiz {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-fill-quiz {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .question-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
      margin-top: 10px;
      margin-bottom: 24px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }
    .option-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: var(--transition-normal);
      font-size: 15px;
      color: var(--text-main);
      font-family: inherit;
      text-align: left;
    }
    .option-card:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.12);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateX(4px);
    }
    .option-card.selected {
      background: rgba(99, 102, 241, 0.25);
      border-color: #6366f1;
    }
    .option-card.correct {
      background: rgba(16, 185, 129, 0.18);
      border-color: #10b981;
      color: #d1fae5;
    }
    .option-card.incorrect {
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
      color: #fee2e2;
    }
    .option-letter {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
    .option-card.correct .option-letter {
      background: #10b981;
      color: #fff;
    }
    .option-card.incorrect .option-letter {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const layout = await renderStudentLayout('games.html', 'Technical Quiz', 'Select your programming language and customize from 10 up to 100 questions. Four randomized options A, B, C, D with live countdown.');
      if (!layout) return;

      const { pageContent, headerActions } = layout;

      headerActions.innerHTML = `
        <a href="leaderboard.html" class="btn-nexus btn-nexus-secondary">
          <i class="fa-solid fa-trophy" style="color:#fbbf24;"></i> Leaderboard
        </a>
        <a href="games.html" class="btn-nexus btn-nexus-secondary">
          <i class="fa-solid fa-arrow-left"></i> All Games
        </a>
      `;

      pageContent.innerHTML = `
        <!-- Setup Screen -->
        <div class="quiz-card" id="quiz-setup-panel">
          <div style="text-align:center;margin-bottom:24px;">
            <div style="font-size:42px;color:var(--cyan-accent);margin-bottom:10px;"><i class="fa-solid fa-code"></i></div>
            <h2 style="font-size:26px;color:#fff;font-weight:800;">Configure Technical Quiz</h2>
            <p style="color:var(--text-secondary);font-size:14px;margin-top:6px;">
              Choose your target programming language and customize test volume (10 to 100 questions).
            </p>
          </div>

          <!-- Step 1: 10 Programming Languages -->
          <div style="margin-bottom:28px;">
            <label style="display:block;font-size:13px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">
              1. Select Programming Language (Choose One):
            </label>
            <div class="languages-grid" id="languages-picker">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Step 2: Configure Questions (10 to 100) -->
          <div style="margin-bottom:32px;background:rgba(15,23,42,0.6);border:1px solid var(--border-subtle);border-radius:12px;padding:22px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <label style="font-size:13px;font-weight:700;color:#38bdf8;text-transform:uppercase;letter-spacing:0.5px;">
                2. Number of Questions (10 to 100):
              </label>
              <span id="selected-count-label" style="font-size:20px;font-weight:800;color:#10b981;">10 Questions</span>
            </div>
            <input type="range" id="question-count-slider" min="10" max="100" value="10" step="5" style="width:100%;cursor:pointer;accent-color:#6366f1;">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:8px;">
              <span>Min: 10 Questions</span>
              <span>25 Questions</span>
              <span>50 Questions</span>
              <span>75 Questions</span>
              <span>Max: 100 Questions</span>
            </div>
          </div>

          <button id="start-quiz-btn" class="btn-nexus btn-nexus-glow" style="width:100%;padding:14px;font-size:16px;font-weight:800;">
            <i class="fa-solid fa-play"></i> START TECHNICAL QUIZ
          </button>
        </div>

        <!-- Active Quiz Play Panel -->
        <div class="quiz-card" id="quiz-play-panel" style="display:none;">
          <div class="quiz-header-bar">
            <div>
              <span class="nexus-badge badge-purple" id="badge-language">Python</span>
              <span class="nexus-badge badge-blue" style="margin-left:8px;" id="badge-counter">Question 1 of 10</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="font-size:13px;color:var(--text-secondary);">
                Score: <strong id="live-correct-count" style="color:#10b981;">0</strong> correct
              </div>
              <div class="timer-badge" id="quiz-timer">
                <i class="fa-regular fa-clock"></i> <span id="timer-text">10:00</span>
              </div>
            </div>
          </div>

          <div class="progress-track-quiz">
            <div class="progress-fill-quiz" id="quiz-progress-bar" style="width:0%;"></div>
          </div>

          <div style="font-size:12px;font-weight:700;color:var(--cyan-accent);text-transform:uppercase;letter-spacing:1px;" id="question-number-lead">
            QUESTION 1
          </div>
          <h2 class="question-title" id="question-title-text">Loading question...</h2>

          <!-- 4 Answer Options (A, B, C, D) with Randomized Order -->
          <div class="options-grid" id="options-container"></div>

          <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-subtle);padding-top:20px;margin-top:12px;">
            <span style="font-size:12px;color:var(--text-muted);">Only correct answers receive marks. Incorrect receive 0.</span>
            <button id="next-question-btn" class="btn-nexus btn-nexus-primary" style="padding:10px 24px;font-weight:700;" disabled>
              Next Question <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Final Scorecard Screen -->
        <div class="quiz-card" id="quiz-result-panel" style="display:none;text-align:center;padding:40px;">
          <div style="font-size:54px;color:#fbbf24;margin-bottom:14px;"><i class="fa-solid fa-trophy"></i></div>
          <h2 style="font-size:26px;color:#fff;font-weight:800;margin-bottom:8px;" id="result-title">Technical Quiz Completed!</h2>
          <p style="color:var(--text-secondary);font-size:14px;margin-bottom:24px;">
            Your performance has been evaluated and recorded on the MongoDB Leaderboard.
          </p>

          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:14px;margin-bottom:28px;">
            <div style="background:rgba(15,23,42,0.6);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Language</div>
              <div style="font-size:20px;color:#fff;font-weight:800;margin-top:4px;" id="res-lang">Python</div>
            </div>
            <div style="background:rgba(15,23,42,0.6);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Total Questions</div>
              <div style="font-size:20px;color:#fff;font-weight:800;margin-top:4px;" id="res-total">10</div>
            </div>
            <div style="background:rgba(15,23,42,0.6);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Correct Answers</div>
              <div style="font-size:20px;color:#10b981;font-weight:800;margin-top:4px;" id="res-correct">8</div>
            </div>
            <div style="background:rgba(15,23,42,0.6);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Incorrect Answers</div>
              <div style="font-size:20px;color:#ef4444;font-weight:800;margin-top:4px;" id="res-incorrect">2</div>
            </div>
            <div style="background:rgba(15,23,42,0.6);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Final Score</div>
              <div style="font-size:20px;color:#38bdf8;font-weight:800;margin-top:4px;" id="res-score">80%</div>
            </div>
          </div>

          <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
            <a href="leaderboard.html" class="btn-nexus btn-nexus-primary" style="padding:12px 28px;">
              <i class="fa-solid fa-trophy"></i> View Global Leaderboard
            </a>
            <button onclick="window.location.reload()" class="btn-nexus btn-nexus-secondary" style="padding:12px 24px;">
              <i class="fa-solid fa-rotate-right"></i> Retake / Choose Another Language
            </button>
          </div>
        </div>
      `;

      // 10 Programming Languages Required:
      const languages = [
        { name: 'Python', icon: 'fa-brands fa-python', color: '#38bdf8' },
        { name: 'Java', icon: 'fa-brands fa-java', color: '#f87171' },
        { name: 'C', icon: 'fa-solid fa-c', color: '#a78bfa' },
        { name: 'C++', icon: 'fa-solid fa-code', color: '#60a5fa' },
        { name: 'JavaScript', icon: 'fa-brands fa-js', color: '#facc15' },
        { name: 'HTML', icon: 'fa-brands fa-html5', color: '#fb923c' },
        { name: 'CSS', icon: 'fa-brands fa-css3-alt', color: '#38bdf8' },
        { name: 'PHP', icon: 'fa-brands fa-php', color: '#818cf8' },
        { name: 'SQL', icon: 'fa-solid fa-database', color: '#34d399' },
        { name: 'C#', icon: 'fa-solid fa-hashtag', color: '#c084fc' }
      ];

      // Question generators for all 10 languages
      const languageQuestionTemplates = {
        'Python': [
          { q: "What is the output of type([]) in Python?", correct: "<class 'list'>", wrong: ["<class 'array'>", "<class 'tuple'>", "<class 'dict'>"] },
          { q: "Which keyword is used to define a function in Python?", correct: "def", wrong: ["function", "fun", "define"] },
          { q: "How do you insert an element at the end of a list in Python?", correct: "list.append(x)", wrong: ["list.add(x)", "list.push(x)", "list.insert(x)"] },
          { q: "Which of the following data structures is immutable in Python?", correct: "tuple", wrong: ["list", "dict", "set"] },
          { q: "What is the purpose of the __init__ method in a Python class?", correct: "Class constructor to initialize attributes", wrong: ["To delete an object", "To import modules", "To declare static methods"] },
          { q: "Which symbol is used for single-line comments in Python?", correct: "#", wrong: ["//", "/*", "--"] },
          { q: "What does PEP 8 represent in Python?", correct: "Python Enhancement Proposal style guide", wrong: ["A database connector", "A cryptographic package", "A virtual environment"] },
          { q: "What will bool('False') evaluate to in Python?", correct: "True", wrong: ["False", "None", "Error"] },
          { q: "How is a set created in Python with elements?", correct: "{1, 2, 3}", wrong: ["[1, 2, 3]", "(1, 2, 3)", "<1, 2, 3>"] },
          { q: "Which keyword handles exceptions in Python?", correct: "try / except", wrong: ["try / catch", "do / rescue", "begin / error"] }
        ],
        'Java': [
          { q: "Which keyword is used to inherit a class in Java?", correct: "extends", wrong: ["implements", "inherits", "instanceof"] },
          { q: "What is the entry point method signature of any Java application?", correct: "public static void main(String[] args)", wrong: ["void main(String args[])", "public void main()", "static int main()"] },
          { q: "Which collection class in Java allows key-value pair mapping?", correct: "HashMap", wrong: ["ArrayList", "HashSet", "LinkedList"] },
          { q: "What is the default value of a boolean variable in Java?", correct: "false", wrong: ["true", "0", "null"] },
          { q: "Which keyword prevents method overriding in Java?", correct: "final", wrong: ["static", "const", "abstract"] },
          { q: "In Java, String objects are:", correct: "Immutable", wrong: ["Mutable", "Primitive", "Dynamic"] },
          { q: "Which package is automatically imported in all Java files?", correct: "java.lang", wrong: ["java.util", "java.io", "java.net"] },
          { q: "What is JVM in Java ecosystem?", correct: "Java Virtual Machine", wrong: ["Java Variable Memory", "Java Visual Manager", "Java Version Module"] },
          { q: "Which operator is used to instantiate an object in Java?", correct: "new", wrong: ["alloc", "create", "make"] },
          { q: "Can an abstract class have constructors in Java?", correct: "Yes, to initialize fields for subclasses", wrong: ["No, abstract classes cannot have constructors", "Only if methods are static", "Only with private access"] }
        ],
        'C': [
          { q: "Which header file is required for printf() and scanf() in C?", correct: "<stdio.h>", wrong: ["<stdlib.h>", "<conio.h>", "<string.h>"] },
          { q: "What operator is used to access the memory address of a variable in C?", correct: "&", wrong: ["*", "->", "%"] },
          { q: "What does malloc() return if memory allocation fails in C?", correct: "NULL", wrong: ["0", "-1", "void"] },
          { q: "What is the size of char data type in C on standard systems?", correct: "1 byte", wrong: ["2 bytes", "4 bytes", "8 bytes"] },
          { q: "How are strings represented in C?", correct: "Null-terminated character arrays ('\\0')", wrong: ["std::string objects", "String primitive", "Linked lists"] }
        ],
        'C++': [
          { q: "Which operator is used for console output in standard C++?", correct: "std::cout <<", wrong: ["std::cin >>", "print()", "Console.Write()"] },
          { q: "What is RAII in modern C++?", correct: "Resource Acquisition Is Initialization", wrong: ["Runtime Array Index Inspector", "Recursive Algorithm Implementation", "Rapid Asynchronous Input"] },
          { q: "Which feature allows multiple functions with the same name but different parameters in C++?", correct: "Function Overloading", wrong: ["Function Overriding", "Dynamic Dispatch", "Polymorphic Casting"] },
          { q: "What smart pointer represents exclusive ownership in C++11?", correct: "std::unique_ptr", wrong: ["std::shared_ptr", "std::weak_ptr", "std::auto_ptr"] }
        ],
        'JavaScript': [
          { q: "What will typeof NaN return in JavaScript?", correct: "'number'", wrong: ["'nan'", "'undefined'", "'object'"] },
          { q: "Which keyword creates a block-scoped reassignable variable in ES6?", correct: "let", wrong: ["var", "const", "def"] },
          { q: "What is the output of 3 + '3' in JavaScript?", correct: "'33'", wrong: ["6", "NaN", "Error"] },
          { q: "Which method converts a JSON string into a JavaScript object?", correct: "JSON.parse()", wrong: ["JSON.stringify()", "JSON.toObject()", "JSON.decode()"] },
          { q: "What is a Closure in JavaScript?", correct: "A function bundled with references to its surrounding state", wrong: ["A method to close browser tabs", "An explicit memory deallocator", "A synchronous loop"] }
        ],
        'HTML': [
          { q: "Which HTML5 tag is used for semantic navigation links?", correct: "<nav>", wrong: ["<navigate>", "<links>", "<menu>"] },
          { q: "Which attribute specifies an alternative text for an image?", correct: "alt", wrong: ["title", "src", "desc"] },
          { q: "What does HTML stand for?", correct: "HyperText Markup Language", wrong: ["Hyperlink Tool Language", "High-level Text Language", "Home Tool Markup"] },
          { q: "Which input type creates a dropdown list in HTML?", correct: "<select>", wrong: ["<dropdown>", "<input type='list'>", "<combo>"] }
        ],
        'CSS': [
          { q: "Which CSS layout model provides two-dimensional grid-based layout?", correct: "CSS Grid (display: grid)", wrong: ["Flexbox", "Float", "Inline-block"] },
          { q: "What CSS property controls the spacing inside an element border?", correct: "padding", wrong: ["margin", "gap", "border-spacing"] },
          { q: "What is the CSS specificity order from highest to lowest?", correct: "Inline style > ID > Class/Pseudo > Element", wrong: ["Element > Class > ID > Inline", "Class > ID > Element", "ID > Element > Class"] },
          { q: "How do you select an element with id 'header' in CSS?", correct: "#header", wrong: [".header", "header", "*header"] }
        ],
        'PHP': [
          { q: "How do all variable names begin in PHP?", correct: "$", wrong: ["@", "&", "#"] },
          { q: "Which superglobal holds form data sent with method='POST' in PHP?", correct: "$_POST", wrong: ["$_GET", "$_REQUEST_DATA", "$_FORM"] },
          { q: "What operator is used to concatenate strings in PHP?", correct: ".", wrong: ["+", "&", ","] },
          { q: "Which function outputs text in PHP?", correct: "echo", wrong: ["print_out", "console.log", "write"] }
        ],
        'SQL': [
          { q: "Which SQL clause is used to filter records after aggregation?", correct: "HAVING", wrong: ["WHERE", "GROUP BY", "ORDER BY"] },
          { q: "Which SQL command deletes all rows from a table without logging individual deletions?", correct: "TRUNCATE TABLE", wrong: ["DELETE FROM", "DROP TABLE", "REMOVE"] },
          { q: "Which JOIN returns all rows from the left table and matched rows from the right table?", correct: "LEFT JOIN", wrong: ["INNER JOIN", "RIGHT JOIN", "FULL JOIN"] },
          { q: "What does ACID stand for in database transactions?", correct: "Atomicity, Consistency, Isolation, Durability", wrong: ["Access, Control, Integrity, Data", "Automated, Concurrent, Indexed, Distributed", "Audit, Check, Insert, Delete"] }
        ],
        'C#': [
          { q: "Which keyword is used to define a class that cannot be inherited in C#?", correct: "sealed", wrong: ["final", "static", "abstract"] },
          { q: "What does LINQ stand for in .NET / C#?", correct: "Language Integrated Query", wrong: ["Linked Index Query", "Logical Network Quality", "Linear Iteration Queue"] },
          { q: "Which keyword creates an asynchronous method in C#?", correct: "async / await", wrong: ["thread / wait", "parallel / join", "task / done"] },
          { q: "What is CLR in the .NET framework?", correct: "Common Language Runtime", wrong: ["Compiled Language Runner", "Core Level Repository", "Common Lineage Registry"] }
        ]
      };

      let selectedLanguage = 'Python';
      let selectedQuestionCount = 10;
      let activeQuestions = [];
      let currentQuestionIndex = 0;
      let userResponses = [];
      let correctCount = 0;
      let timerSeconds = 600;
      let timerInterval = null;
      let activeGameRecord = null;
      const attemptId = `quiz-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

      try {
        const gamesRes = await api.get('/games');
        const dbGame = (gamesRes.games || []).find(g => g.slug === 'technical-quiz' || g.gameType === 'quiz');
        if (dbGame) activeGameRecord = dbGame;
      } catch (e) {
        console.warn('Could not load game record:', e);
      }

      // Render Setup Screen
      const langPicker = document.getElementById('languages-picker');
      langPicker.innerHTML = languages.map(l => `
        <button type="button" class="lang-card-btn ${l.name === selectedLanguage ? 'selected' : ''}" data-lang="${l.name}">
          <i class="${l.icon} lang-icon" style="color:${l.color};"></i>
          <span style="font-weight:700;font-size:14px;">${l.name}</span>
        </button>
      `).join('');

      langPicker.querySelectorAll('.lang-card-btn').forEach(btn => {
        btn.onclick = () => {
          langPicker.querySelectorAll('.lang-card-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedLanguage = btn.dataset.lang;
        };
      });

      const countSlider = document.getElementById('question-count-slider');
      const countLabel = document.getElementById('selected-count-label');
      countSlider.oninput = () => {
        selectedQuestionCount = Number(countSlider.value);
        countLabel.textContent = `${selectedQuestionCount} Questions`;
      };

      function generateLanguageQuestions(lang, count) {
        const templates = languageQuestionTemplates[lang] || languageQuestionTemplates['Python'];
        const list = [];

        for (let i = 0; i < count; i++) {
          const base = templates[i % templates.length];
          // Build randomized options A, B, C, D
          const allOptions = [base.correct, ...base.wrong];
          // Fisher-Yates shuffle to randomize correct answer position (not always A or D)
          for (let j = allOptions.length - 1; j > 0; j--) {
            const rand = Math.floor(Math.random() * (j + 1));
            [allOptions[j], allOptions[rand]] = [allOptions[rand], allOptions[j]];
          }

          const correctIdx = allOptions.indexOf(base.correct);
          const variationText = (i >= templates.length) ? ` (Question #${i + 1})` : '';

          list.push({
            id: i + 1,
            question: `${base.q}${variationText}`,
            options: allOptions,
            correctAnswerIndex: correctIdx
          });
        }
        return list;
      }

      function startQuiz() {
        activeQuestions = generateLanguageQuestions(selectedLanguage, selectedQuestionCount);
        currentQuestionIndex = 0;
        userResponses = [];
        correctCount = 0;
        timerSeconds = selectedQuestionCount * 60; // 1 min per question

        document.getElementById('quiz-setup-panel').style.display = 'none';
        document.getElementById('quiz-play-panel').style.display = 'block';
        document.getElementById('badge-language').textContent = selectedLanguage;

        renderQuestion();
        startTimer();
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);

        function tick() {
          const m = Math.floor(timerSeconds / 60);
          const s = timerSeconds % 60;
          document.getElementById('timer-text').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            showToast('Time expired! Submitting completed answers...', 'warning');
            finishQuiz();
          }
          timerSeconds--;
        }

        tick();
        timerInterval = setInterval(tick, 1000);
      }

      function renderQuestion() {
        const q = activeQuestions[currentQuestionIndex];
        const total = activeQuestions.length;

        document.getElementById('badge-counter').textContent = `Question ${currentQuestionIndex + 1} of ${total}`;
        document.getElementById('question-number-lead').textContent = `QUESTION ${currentQuestionIndex + 1} OF ${total}`;
        document.getElementById('question-title-text').textContent = q.question;
        document.getElementById('live-correct-count').textContent = correctCount;

        const pct = Math.round((currentQuestionIndex / total) * 100);
        document.getElementById('quiz-progress-bar').style.width = `${pct}%`;

        const optContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-question-btn');
        nextBtn.disabled = true;

        const letters = ['A', 'B', 'C', 'D'];

        optContainer.innerHTML = q.options.map((opt, idx) => `
          <button type="button" class="option-card" data-idx="${idx}">
            <div class="option-letter">${letters[idx]}</div>
            <div style="flex:1;">${opt}</div>
          </button>
        `).join('');

        let answered = false;

        optContainer.querySelectorAll('.option-card').forEach(card => {
          card.onclick = () => {
            if (answered) return;
            answered = true;
            const chosenIdx = Number(card.dataset.idx);
            const isCorrect = chosenIdx === q.correctAnswerIndex;

            optContainer.querySelectorAll('.option-card').forEach((c, i) => {
              c.disabled = true;
              if (i === q.correctAnswerIndex) c.classList.add('correct');
              else if (i === chosenIdx) c.classList.add('incorrect');
            });

            if (isCorrect) {
              correctCount++;
              document.getElementById('live-correct-count').textContent = correctCount;
            }

            userResponses.push({ questionId: q.id, chosen: chosenIdx, isCorrect });

            nextBtn.disabled = false;
            nextBtn.innerHTML = (currentQuestionIndex === total - 1)
              ? '<i class="fa-solid fa-flag-checkered"></i> View Results'
              : 'Next Question <i class="fa-solid fa-arrow-right"></i>';
          };
        });

        nextBtn.onclick = () => {
          if (currentQuestionIndex < total - 1) {
            currentQuestionIndex++;
            renderQuestion();
          } else {
            finishQuiz();
          }
        };
      }

      async function finishQuiz() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('quiz-play-panel').style.display = 'none';
        document.getElementById('quiz-result-panel').style.display = 'block';

        const total = activeQuestions.length;
        const scorePct = Math.round((correctCount / total) * 100);

        document.getElementById('res-lang').textContent = selectedLanguage;
        document.getElementById('res-total').textContent = total;
        document.getElementById('res-correct').textContent = correctCount;
        document.getElementById('res-incorrect').textContent = total - correctCount;
        document.getElementById('res-score').textContent = `${scorePct}%`;

        // Save to MongoDB and update Leaderboard
        try {
          const gameId = activeGameRecord?._id || 'technical-quiz';
          await api.post(`/games/${encodeURIComponent(gameId)}/submit`, {
            attemptId,
            gameName: `Technical Quiz (${selectedLanguage})`,
            selectedLanguage,
            score: scorePct,
            totalQuestions: total,
            correctCount,
            timeTaken: (selectedQuestionCount * 60) - timerSeconds
          });
          showToast('Technical Quiz score officially submitted to the Leaderboard!', 'success');
        } catch (err) {
          console.warn('Game submit warning:', err.message);
        }
      }

      document.getElementById('start-quiz-btn').onclick = startQuiz;
    });
  </script>
</body>
</html>
