<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration | EDUTECH NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/nexus-core.css">
  <style>
    .reg-wrapper {
      max-width: 820px;
      margin: 0 auto;
    }
    .course-summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .course-summary-thumb {
      width: 110px;
      height: 75px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border-subtle);
    }
    .access-banner {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: #c7d2fe;
    }
    .reg-form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      backdrop-filter: blur(14px);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .form-grid .full-width {
      grid-column: span 2;
    }
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-grid .full-width {
        grid-column: span 1;
      }
      .course-summary-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .field-input, .field-select, .field-textarea {
      width: 100%;
      height: 44px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: var(--transition-fast);
      box-sizing: border-box;
    }
    .field-textarea {
      height: 80px;
      padding: 10px 14px;
      resize: vertical;
    }
    .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: var(--cyan-accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    .field-input[readonly] {
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nexus-student.js"></script>
  <script>
    let courseData = null;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Authentication Check
      currentUser = await auth.getCurrentUser();
      if (!currentUser) {
        sessionStorage.setItem('redirectAfterLogin', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const courseId = params.get('courseId') || params.get('id');

      if (!courseId) {
        alert('No course ID specified.');
        window.location.href = 'courses.html';
        return;
      }

      const layout = await renderStudentLayout('courses.html', 'Course Registration', 'Official course enrollment and participant verification.');
      if (!layout) return;

      const { pageContent } = layout;

      pageContent.innerHTML = `
        <div class="reg-wrapper">
          <div id="courseSummaryBox">
            <div class="state-container">
              <div class="state-spinner"></div>
              <div class="state-title">Loading course details...</div>
            </div>
          </div>

          <div class="access-banner">
            <i class="fa-solid fa-clock" style="font-size:24px;color:var(--cyan-accent);"></i>
            <div>
              <strong>30 Days Full Access Guarantee</strong>
              <div>Upon registration, your account is granted full curriculum, lesson exercises, and certificate eligibility for 30 calendar days.</div>
            </div>
          </div>

          <div class="reg-form-card">
            <div id="regAlert" style="display:none;padding:12px 16px;border-radius:8px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;font-size:13px;margin-bottom:20px;"></div>

            <form id="courseRegForm" novalidate>
              <div class="form-grid">
                <!-- 1. Full Name -->
                <div class="field-group">
                  <label for="crFullName">Full Name *</label>
                  <input type="text" id="crFullName" class="field-input" required>
                </div>

                <!-- 2. Email Address -->
                <div class="field-group">
                  <label for="crEmail">Email Address (Read-only)</label>
                  <input type="email" id="crEmail" class="field-input" readonly>
                </div>

                <!-- 3. Phone -->
                <div class="field-group">
                  <label for="crPhone">Phone Number *</label>
                  <input type="tel" id="crPhone" class="field-input" placeholder="+91 9876543210" required>
                </div>

                <!-- 4. Age -->
                <div class="field-group">
                  <label for="crAge">Age *</label>
                  <input type="number" id="crAge" class="field-input" min="10" max="100" required>
                </div>

                <!-- 5. User Type -->
                <div class="field-group full-width">
                  <label for="crUserType">Participant Category *</label>
                  <select id="crUserType" class="field-select" required>
                    <option value="student">Student (School / College / University)</option>
                    <option value="staff">Staff / Faculty / Professor</option>
                    <option value="worker">Working Professional / Industry Worker</option>
                    <option value="other">Other / Independent Learner</option>
                  </select>
                </div>

                <!-- Conditional Student Fields -->
                <div id="studentFields" class="full-width" style="display:contents;">
                  <div class="field-group">
                    <label for="crStudentInst">College / University / Institution *</label>
                    <input type="text" id="crStudentInst" class="field-input" placeholder="e.g. MIT, Anna University">
                  </div>
                  <div class="field-group">
                    <label for="crStudentDept">Department *</label>
                    <input type="text" id="crStudentDept" class="field-input" placeholder="e.g. Computer Science & Engineering">
                  </div>
                  <div class="field-group">
                    <label for="crStudentYear">Current Year *</label>
                    <select id="crStudentYear" class="field-select">
                      <option value="1">1st Year</option>
                      <option value="2">2nd Year</option>
                      <option value="3">3rd Year</option>
                      <option value="4">4th Year</option>
                      <option value="Postgraduate">Postgraduate</option>
                    </select>
                  </div>
                  <div class="field-group">
                    <label for="crStudentReg">Register Number / Student ID *</label>
                    <input type="text" id="crStudentReg" class="field-input" placeholder="e.g. 717822P101">
                  </div>
                </div>

                <!-- Conditional Staff Fields -->
                <div id="staffFields" class="full-width" style="display:none;">
                  <div class="form-grid" style="width:100%;">
                    <div class="field-group">
                      <label for="crStaffInst">Institution / University *</label>
                      <input type="text" id="crStaffInst" class="field-input">
                    </div>
                    <div class="field-group">
                      <label for="crStaffDept">Department *</label>
                      <input type="text" id="crStaffDept" class="field-input">
                    </div>
                    <div class="field-group full-width">
                      <label for="crStaffDesig">Designation *</label>
                      <input type="text" id="crStaffDesig" class="field-input" placeholder="e.g. Assistant Professor">
                    </div>
                  </div>
                </div>

                <!-- Conditional Worker Fields -->
                <div id="workerFields" class="full-width" style="display:none;">
                  <div class="form-grid" style="width:100%;">
                    <div class="field-group">
                      <label for="crWorkerCompany">Company / Organization *</label>
                      <input type="text" id="crWorkerCompany" class="field-input">
                    </div>
                    <div class="field-group">
                      <label for="crWorkerRole">Job Role / Title *</label>
                      <input type="text" id="crWorkerRole" class="field-input" placeholder="e.g. Junior Frontend Developer">
                    </div>
                  </div>
                </div>

                <!-- Conditional Other Fields -->
                <div id="otherFields" class="full-width" style="display:none;">
                  <div class="form-grid" style="width:100%;">
                    <div class="field-group">
                      <label for="crOtherOrg">Organization *</label>
                      <input type="text" id="crOtherOrg" class="field-input">
                    </div>
                    <div class="field-group">
                      <label for="crOtherOcc">Occupation *</label>
                      <input type="text" id="crOtherOcc" class="field-input">
                    </div>
                  </div>
                </div>

                <!-- Place & Address -->
                <div class="field-group">
                  <label for="crCity">City / Place *</label>
                  <input type="text" id="crCity" class="field-input" placeholder="e.g. Bangalore, Chennai">
                </div>
                <div class="field-group">
                  <label for="crState">State / Region</label>
                  <input type="text" id="crState" class="field-input" placeholder="e.g. Karnataka, Tamil Nadu">
                </div>

                <div class="field-group full-width">
                  <label for="crAddress">Complete Address</label>
                  <textarea id="crAddress" class="field-textarea" placeholder="Street, landmark, pincode..."></textarea>
                </div>
              </div>

              <div style="margin-top:28px;display:flex;gap:14px;justify-content:flex-end;">
                <a href="course-details.html?id=${courseId}" class="btn-nexus btn-nexus-secondary" style="padding:10px 22px;">Cancel</a>
                <button type="submit" id="btnSubmitReg" class="btn-nexus btn-nexus-primary" style="padding:10px 28px;">
                  <i class="fa-solid fa-graduation-cap"></i> Complete Registration (30 Days)
                </button>
              </div>
            </form>
          </div>
        </div>
      `;

      setupCategoryToggle();
      await loadCourseAndUser(courseId);
    });

    function setupCategoryToggle() {
      const typeSelect = document.getElementById('crUserType');
      const studentFields = document.getElementById('studentFields');
      const staffFields = document.getElementById('staffFields');
      const workerFields = document.getElementById('workerFields');
      const otherFields = document.getElementById('otherFields');

      typeSelect.addEventListener('change', () => {
        const val = typeSelect.value;
        studentFields.style.display = val === 'student' ? 'contents' : 'none';
        staffFields.style.display = val === 'staff' ? 'block' : 'none';
        workerFields.style.display = val === 'worker' ? 'block' : 'none';
        otherFields.style.display = val === 'other' ? 'block' : 'none';
      });
    }

    async function loadCourseAndUser(courseId) {
      try {
        // Fetch course info
        const courseRes = await api.get(`/courses/${courseId}`);
        courseData = courseRes.course || courseRes;

        const summaryBox = document.getElementById('courseSummaryBox');
        if (summaryBox && courseData) {
          summaryBox.innerHTML = `
            <div class="course-summary-card">
              <img src="${courseData.image || 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500&q=80'}" class="course-summary-thumb" alt="${courseData.title}">
              <div style="flex:1;">
                <div style="display:flex;gap:8px;margin-bottom:6px;">
                  <span class="nexus-badge badge-purple">${courseData.category || 'Engineering'}</span>
                  <span class="nexus-badge badge-blue">${courseData.level || 'All Levels'}</span>
                  <span class="nexus-badge badge-amber"><i class="fa-solid fa-bolt"></i> +${courseData.xpReward || courseData.xp || 120} XP</span>
                </div>
                <h3 style="font-size:18px;margin-bottom:4px;color:#fff;">${courseData.title}</h3>
                <p style="font-size:13px;color:var(--text-secondary);margin:0;">Instructor: <strong>${courseData.instructor || 'Nexus Faculty'}</strong> &bull; Duration: <strong>${courseData.duration || '6 Weeks'}</strong></p>
              </div>
            </div>
          `;
        }

        // Fetch User Me details
        let meData = currentUser;
        try {
          const meRes = await api.get('/auth/me');
          if (meRes.success && meRes.user) meData = meRes.user;
        } catch (e) {
          console.warn('Could not refresh /auth/me:', e);
        }

        // Pre-fill fields
        if (meData) {
          document.getElementById('crFullName').value = meData.fullName || '';
          document.getElementById('crEmail').value = meData.email || '';
          document.getElementById('crPhone').value = meData.phone || '';
          document.getElementById('crAge').value = meData.age || '';
          document.getElementById('crCity').value = meData.place || meData.city || '';
          document.getElementById('crState').value = meData.state || '';
          document.getElementById('crAddress').value = meData.address || '';

          if (meData.userType) {
            document.getElementById('crUserType').value = meData.userType;
            document.getElementById('crUserType').dispatchEvent(new Event('change'));
          }

          if (meData.userType === 'student' || !meData.userType) {
            document.getElementById('crStudentInst').value = meData.institution || meData.college || '';
            document.getElementById('crStudentDept').value = meData.department || '';
            document.getElementById('crStudentYear').value = meData.year || '1';
            document.getElementById('crStudentReg').value = meData.registerNumber || '';
          } else if (meData.userType === 'staff') {
            document.getElementById('crStaffInst').value = meData.institution || '';
            document.getElementById('crStaffDept').value = meData.department || '';
            document.getElementById('crStaffDesig').value = meData.designation || '';
          } else if (meData.userType === 'worker') {
            document.getElementById('crWorkerCompany').value = meData.company || meData.institution || '';
            document.getElementById('crWorkerRole').value = meData.designation || '';
          } else if (meData.userType === 'other') {
            document.getElementById('crOtherOrg').value = meData.institution || '';
            document.getElementById('crOtherOcc').value = meData.occupation || '';
          }
        }

        // Setup Form Submit
        const form = document.getElementById('courseRegForm');
        form.addEventListener('submit', handleRegistrationSubmit);

      } catch (err) {
        console.error('Error loading course:', err);
        const summaryBox = document.getElementById('courseSummaryBox');
        if (summaryBox) {
          summaryBox.innerHTML = `
            <div class="state-container">
              <i class="fa-solid fa-triangle-exclamation" style="font-size:32px;color:#f87171;margin-bottom:12px;"></i>
              <div class="state-title">Course Not Found</div>
              <div class="state-desc">The requested course could not be loaded. Please return to catalog.</div>
            </div>
          `;
        }
      }
    }

    async function handleRegistrationSubmit(e) {
      e.preventDefault();
      const alertBox = document.getElementById('regAlert');
      alertBox.style.display = 'none';

      const fullName = document.getElementById('crFullName').value.trim();
      const phone = document.getElementById('crPhone').value.trim();
      const age = document.getElementById('crAge').value.trim();
      const userType = document.getElementById('crUserType').value;
      const city = document.getElementById('crCity').value.trim();
      const state = document.getElementById('crState').value.trim();
      const address = document.getElementById('crAddress').value.trim();

      if (!fullName) {
        alertBox.textContent = 'Please enter your full name.';
        alertBox.style.display = 'block';
        return;
      }
      if (!phone) {
        alertBox.textContent = 'Please enter your phone number.';
        alertBox.style.display = 'block';
        return;
      }
      if (!age) {
        alertBox.textContent = 'Please enter your age.';
        alertBox.style.display = 'block';
        return;
      }

      const payload = { fullName, phone, age, userType, city, state, place: city, address };

      if (userType === 'student') {
        const inst = document.getElementById('crStudentInst').value.trim();
        const dept = document.getElementById('crStudentDept').value.trim();
        const yr = document.getElementById('crStudentYear').value.trim();
        const reg = document.getElementById('crStudentReg').value.trim();
        if (!inst || !dept || !reg) {
          alertBox.textContent = 'College name, department, and register number are required for students.';
          alertBox.style.display = 'block';
          return;
        }
        payload.institution = inst;
        payload.department = dept;
        payload.year = yr;
        payload.registerNumber = reg;
      } else if (userType === 'staff') {
        const inst = document.getElementById('crStaffInst').value.trim();
        const dept = document.getElementById('crStaffDept').value.trim();
        const desig = document.getElementById('crStaffDesig').value.trim();
        if (!inst || !dept || !desig) {
          alertBox.textContent = 'Institution, department, and designation are required for staff.';
          alertBox.style.display = 'block';
          return;
        }
        payload.institution = inst;
        payload.department = dept;
        payload.designation = desig;
      } else if (userType === 'worker') {
        const comp = document.getElementById('crWorkerCompany').value.trim();
        const role = document.getElementById('crWorkerRole').value.trim();
        if (!comp || !role) {
          alertBox.textContent = 'Company and job role are required for workers.';
          alertBox.style.display = 'block';
          return;
        }
        payload.company = comp;
        payload.designation = role;
      } else if (userType === 'other') {
        const org = document.getElementById('crOtherOrg').value.trim();
        const occ = document.getElementById('crOtherOcc').value.trim();
        if (!org || !occ) {
          alertBox.textContent = 'Organization and occupation are required.';
          alertBox.style.display = 'block';
          return;
        }
        payload.institution = org;
        payload.occupation = occ;
      }

      const submitBtn = document.getElementById('btnSubmitReg');
      const origHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registering...';

      try {
        const res = await api.post(`/courses/${courseData._id}/register`, payload);
        submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Registered ✓';

        showToast(res.message || 'Course registration successful! 30 days active access.', 'success');

        setTimeout(() => {
          window.location.href = `lessons.html?courseId=${courseData._id}`;
        }, 900);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = origHtml;
        alertBox.textContent = err.message || 'Registration failed. Please check inputs.';
        alertBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
