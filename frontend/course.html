<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Lesson | EDUTECH NEXUS</title><link rel="stylesheet" href="css/student-modules.css"></head><body><script src="js/api.js"></script><script src="js/auth.js"></script><script>const id=new URLSearchParams(location.search).get('id');document.addEventListener('DOMContentLoaded',async()=>{const user=await auth.requireLogin();if(!user)return;try{const result=await api.get(`/courses/${id}`),course=result.course;document.body.innerHTML=`<main class="student-main" style="margin-left:0;width:100%;max-width:1000px"><header class="student-top"><div><div class="eyebrow">EDUTECH NEXUS / COURSE</div><h1>${course.title}</h1><p class="muted">${course.description}</p></div><div class="identity">${user.fullName}</div></header><section class="grid">${(course.lessons||[]).map((lesson,index)=>`<article class="card"><h2>Lesson ${index+1}: ${lesson.title}</h2><p>${lesson.content}</p></article>`).join('')}</section><button class="btn" id="complete">Mark course complete</button><a class="btn secondary" href="courses.html">Back to courses</a><p id="status" class="muted"></p></main>`;document.getElementById('complete').onclick=async()=>{try{await api.post(`/courses/${id}/complete`,{});status.textContent='Course completed. Certificate eligibility unlocked.';document.getElementById('complete').disabled=true}catch(error){status.textContent=error.message}}}catch(error){document.body.innerHTML=`<main class="student-main" style="margin-left:0"><div class="empty">${error.message}</div></main>`}});</script></body></html>
